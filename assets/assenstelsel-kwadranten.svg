<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t1 d1">
  <title id="t1">Cartesisch assenstelsel</title>
  <desc id="d1">x-as en y-as, oorsprong, vier kwadranten en het punt A(3, 2).</desc>
  <rect width="900" height="560" fill="#161410"/>
  <text x="450" y="40" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="26">Punten in het vlak</text>
  <g transform="translate(450,300)">
    <line x1="-320" y1="0" x2="320" y2="0" stroke="#e6c77a" stroke-width="2.5"/>
    <line x1="0" y1="220" x2="0" y2="-220" stroke="#e6c77a" stroke-width="2.5"/>
    <polygon points="320,-7 342,0 320,7" fill="#e6c77a"/>
    <polygon points="-7,-220 0,-242 7,-220" fill="#e6c77a"/>
    <text x="332" y="-16" fill="#e6c77a" font-family="Georgia, serif" font-size="20">x</text>
    <text x="14" y="-228" fill="#e6c77a" font-family="Georgia, serif" font-size="20">y</text>
    <g stroke="#3a3428" stroke-width="1">
      <line x1="-240" y1="-160" x2="-240" y2="160"/>
      <line x1="-160" y1="-160" x2="-160" y2="160"/>
      <line x1="-80" y1="-160" x2="-80" y2="160"/>
      <line x1="80" y1="-160" x2="80" y2="160"/>
      <line x1="160" y1="-160" x2="160" y2="160"/>
      <line x1="240" y1="-160" x2="240" y2="160"/>
      <line x1="-240" y1="-160" x2="240" y2="-160"/>
      <line x1="-240" y1="-80" x2="240" y2="-80"/>
      <line x1="-240" y1="80" x2="240" y2="80"/>
      <line x1="-240" y1="160" x2="240" y2="160"/>
    </g>
    <text x="148" y="-88" fill="#cbb98a" font-family="Georgia, serif" font-size="22">I</text>
    <text x="-168" y="-88" fill="#cbb98a" font-family="Georgia, serif" font-size="22">II</text>
    <text x="-178" y="108" fill="#cbb98a" font-family="Georgia, serif" font-size="22">III</text>
    <text x="140" y="108" fill="#cbb98a" font-family="Georgia, serif" font-size="22">IV</text>
    <circle cx="240" cy="-160" r="7" fill="#f3e2b0"/>
    <text x="252" y="-172" fill="#f3e2b0" font-family="Georgia, serif" font-size="18">A(3, 2)</text>
    <text x="8" y="22" fill="#d7c49a" font-family="Georgia, serif" font-size="16">(0, 0)</text>
    <text x="78" y="22" fill="#8a7a58" font-family="Georgia, serif" font-size="14">1</text>
    <text x="8" y="-72" fill="#8a7a58" font-family="Georgia, serif" font-size="14">1</text>
  </g>
  <text x="450" y="535" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="17">Eerst x (rechts/links), dan y (omhoog/omlaag). A ligt in kwadrant I.</text>
</svg>
