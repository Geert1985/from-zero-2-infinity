<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Lineaire transformatie</title>
  <desc id="desc">Het vierkante rooster gaat over in het parallellogramrooster van de kolommen van A. De oorsprong blijft vast.</desc>
  <rect width="1000" height="500" fill="#161410"/>
  <text x="230" y="36" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="22">Voor</text>
  <text x="730" y="36" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="22">Na, met A</text>
  <defs>
    <marker id="mu" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 12,6 0,11" fill="#f3e2b0"/>
    </marker>
    <marker id="mv" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 12,6 0,11" fill="#7dcea0"/>
    </marker>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 12,6 0,11" fill="#e6c77a"/>
    </marker>
  </defs>

  <!-- vierkant rooster -->
  <g>
    <line x1="128" y1="168" x2="128" y2="338" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="162" y1="168" x2="162" y2="338" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="196" y1="168" x2="196" y2="338" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="230" y1="168" x2="230" y2="338" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="264" y1="168" x2="264" y2="338" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="298" y1="168" x2="298" y2="338" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="332" y1="168" x2="332" y2="338" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="128" y1="338" x2="332" y2="338" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="128" y1="304" x2="332" y2="304" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="128" y1="270" x2="332" y2="270" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="128" y1="236" x2="332" y2="236" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="128" y1="202" x2="332" y2="202" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="128" y1="168" x2="332" y2="168" stroke="#3a3428" stroke-width="1.2"/>
    <polygon points="230,270 264,270 264,236 230,236" fill="#e6c77a" fill-opacity="0.14"/>
    <line x1="128" y1="270" x2="340" y2="270" stroke="#8a7a58" stroke-width="1.6"/>
    <line x1="230" y1="346" x2="230" y2="160" stroke="#8a7a58" stroke-width="1.6"/>
    <line x1="230" y1="270" x2="264" y2="270" stroke="#f3e2b0" stroke-width="3.5" marker-end="url(#mu)"/>
    <line x1="230" y1="270" x2="230" y2="236" stroke="#7dcea0" stroke-width="3.5" marker-end="url(#mv)"/>
    <circle cx="230" cy="270" r="3.5" fill="#f7edd6"/>
    <text x="276" y="288" fill="#f3e2b0" font-family="Georgia, serif" font-size="16">(1, 0)</text>
    <text x="218" y="228" text-anchor="end" fill="#7dcea0" font-family="Georgia, serif" font-size="16">(0, 1)</text>
  </g>

  <line x1="360" y1="250" x2="430" y2="250" stroke="#e6c77a" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M468 228 H452 V292 H468" fill="none" stroke="#e6c77a" stroke-width="2"/>
  <path d="M548 228 H564 V292 H548" fill="none" stroke="#e6c77a" stroke-width="2"/>
  <g fill="#fff6df" font-family="Georgia, serif" font-size="22" text-anchor="middle">
    <text x="486" y="256">2</text><text x="526" y="256">1</text>
    <text x="486" y="286">1</text><text x="526" y="286">1</text>
  </g>
  <text x="508" y="318" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="16">A</text>

  <!-- parallellogramrooster: beeld van m(1,0)+n(0,1) is m(2,1)+n(1,1) -->
  <g>
    <line x1="574" y1="374" x2="782" y2="270" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="600" y1="348" x2="808" y2="244" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="626" y1="322" x2="834" y2="218" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="652" y1="296" x2="860" y2="192" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="678" y1="270" x2="886" y2="166" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="574" y1="374" x2="678" y2="270" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="626" y1="348" x2="730" y2="244" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="678" y1="322" x2="782" y2="218" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="730" y1="296" x2="834" y2="192" stroke="#3a3428" stroke-width="1.2"/>
    <line x1="782" y1="270" x2="886" y2="166" stroke="#3a3428" stroke-width="1.2"/>
    <polygon points="730,270 782,244 808,218 756,244" fill="#e6c77a" fill-opacity="0.14"/>
    <line x1="640" y1="270" x2="860" y2="270" stroke="#8a7a58" stroke-width="1.4"/>
    <line x1="730" y1="340" x2="730" y2="170" stroke="#8a7a58" stroke-width="1.4"/>
    <line x1="730" y1="270" x2="782" y2="244" stroke="#f3e2b0" stroke-width="3.5" marker-end="url(#mu)"/>
    <line x1="730" y1="270" x2="756" y2="244" stroke="#7dcea0" stroke-width="3.5" marker-end="url(#mv)"/>
    <circle cx="730" cy="270" r="3.5" fill="#f7edd6"/>
    <text x="792" y="262" fill="#f3e2b0" font-family="Georgia, serif" font-size="16">(2, 1)</text>
    <text x="744" y="228" text-anchor="end" fill="#7dcea0" font-family="Georgia, serif" font-size="16">(1, 1)</text>
  </g>

  <text x="500" y="430" text-anchor="middle" fill="#fff6df" font-family="Georgia, serif" font-size="18">De kolommen van A zijn de beelden van (1, 0) en (0, 1). De oorsprong blijft vast.</text>
  <text x="500" y="462" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="16">Een vierkant wordt een parallellogram. Optellen en schalen blijven gelden.</text>
</svg>
