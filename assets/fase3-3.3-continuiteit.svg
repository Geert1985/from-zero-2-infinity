<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Continu en niet continu</title>
  <desc id="desc">Links een ononderbroken grafiek. Rechts een sprong: op dezelfde x eindigt de linker tak lager dan de rechter begint.</desc>
  <rect width="900" height="520" fill="#161410"/>
  <text x="230" y="42" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="24">Continu</text>
  <text x="670" y="42" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="24">Niet continu</text>
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#8a7a58"/>
    </marker>
  </defs>

  <g transform="translate(40,0)">
    <line x1="40" y1="360" x2="360" y2="360" stroke="#8a7a58" stroke-width="2" marker-end="url(#ax)"/>
    <line x1="40" y1="360" x2="40" y2="80" stroke="#8a7a58" stroke-width="2" marker-end="url(#ax)"/>
    <path d="M70 320 C140 300 170 230 210 180 C250 130 300 110 350 90" fill="none" stroke="#cbb98a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="210" cy="180" r="6" fill="#f7edd6"/>
    <text x="200" y="420" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="16">limiet = functiewaarde</text>
  </g>

  <g transform="translate(480,0)">
    <line x1="40" y1="360" x2="360" y2="360" stroke="#8a7a58" stroke-width="2" marker-end="url(#ax)"/>
    <line x1="40" y1="360" x2="40" y2="80" stroke="#8a7a58" stroke-width="2" marker-end="url(#ax)"/>
    <line x1="190" y1="360" x2="190" y2="120" stroke="#6f6557" stroke-width="1.4" stroke-dasharray="5 6"/>
    <path d="M70 310 C120 280 155 250 190 214" fill="none" stroke="#cbb98a" stroke-width="3" stroke-linecap="round"/>
    <path d="M190 130 C240 112 290 98 350 86" fill="none" stroke="#cbb98a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="190" cy="214" r="6.5" fill="#161410" stroke="#f7edd6" stroke-width="2.5"/>
    <circle cx="190" cy="130" r="6" fill="#f7edd6"/>
    <text x="200" y="420" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="16">sprong: links en rechts verschillen</text>
  </g>
</svg>
