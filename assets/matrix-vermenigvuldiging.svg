<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Matrixvermenigvuldiging als rij-kolomproduct</title>
  <desc id="desc">Een rij van matrix A wordt gecombineerd met een kolom van matrix B. De overeenkomstige producten worden opgeteld tot één element van matrix AB.</desc>
  <rect x="0" y="0" width="1200" height="620" fill="#f7f4ec"/>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#222">Rij × kolom → één element</text>

  <text x="250" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#333">A</text>
  <text x="600" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#333">B</text>
  <text x="970" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#333">AB</text>

  <g stroke="#333" stroke-width="2" fill="#fff">
    <rect x="100" y="135" width="300" height="180" rx="8"/>
    <rect x="510" y="135" width="180" height="180" rx="8"/>
    <rect x="850" y="135" width="240" height="180" rx="8"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="27" text-anchor="middle" fill="#222">
    <text x="175" y="190">2</text><text x="250" y="190">1</text><text x="325" y="190">3</text>
    <text x="175" y="250">4</text><text x="250" y="250">0</text><text x="325" y="250">−1</text>
    <text x="555" y="190">5</text><text x="645" y="190">2</text>
    <text x="555" y="250">1</text><text x="645" y="250">3</text>
    <text x="910" y="190">15</text><text x="1010" y="190">10</text>
    <text x="910" y="250">19</text><text x="1010" y="250">5</text>
  </g>

  <rect x="110" y="148" width="280" height="48" rx="6" fill="#eadfbf" stroke="#8a6d1d" stroke-width="3"/>
  <rect x="520" y="148" width="70" height="165" rx="6" fill="#eadfbf" stroke="#8a6d1d" stroke-width="3"/>
  <rect x="860" y="148" width="100" height="48" rx="6" fill="#e2eadf" stroke="#52704d" stroke-width="3"/>

  <g font-family="Arial, sans-serif" font-size="22" fill="#333">
    <text x="250" y="355" text-anchor="middle">eerste rij van A</text>
    <text x="555" y="355" text-anchor="middle">eerste kolom van B</text>
    <text x="910" y="355" text-anchor="middle">eerste element</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#222">
    <text x="600" y="425">2 × 5 + 1 × 1 + 3 × 0 = 11</text>
  </g>

  <g stroke="#555" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M 400 230 C 445 230, 465 230, 505 230"/>
    <path d="M 700 230 C 755 230, 790 230, 845 230"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="21" fill="#555">
    <text x="600" y="485" text-anchor="middle">Dezelfde rij-kolomberekening wordt herhaald voor elk element van AB.</text>
    <text x="600" y="525" text-anchor="middle" font-weight="700">De binnenste afmetingen moeten overeenkomen.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>
</svg>