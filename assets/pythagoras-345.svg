<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="tp dp">
  <title id="tp">Stelling van Pythagoras</title>
  <desc id="dp">Rechthoekige driehoek met zijden 3, 4 en 5. a² + b² = c².</desc>
  <rect width="900" height="480" fill="#161410"/>
  <text x="450" y="38" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="24">a² + b² = c²</text>
  <g transform="translate(280,90)">
    <!-- triangle: right angle at origin, 3*40=120 right, 4*40=160 up -->
    <polygon points="0,280 240,280 0,0" fill="#2a2418" stroke="#f3e2b0" stroke-width="3"/>
    <rect x="0" y="256" width="24" height="24" fill="none" stroke="#c4a45a" stroke-width="2"/>
    <text x="118" y="308" fill="#d7c49a" font-family="Georgia, serif" font-size="20">a = 3</text>
    <text x="-58" y="150" fill="#d7c49a" font-family="Georgia, serif" font-size="20">b = 4</text>
    <text x="128" y="130" fill="#f3e2b0" font-family="Georgia, serif" font-size="20">c = 5</text>
  </g>
  <text x="450" y="430" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="17">3² + 4² = 9 + 16 = 25 = 5². De rechte hoek zit tussen a en b; c is de schuine zijde.</text>
</svg>
