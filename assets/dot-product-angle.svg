<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Inwendig product als projectie</title>
  <desc id="desc">Zoals in OpenStax: twee vectoren met de staart samen, stippellijn door v, loodlijn vanuit de punt van u. De gouden vector is de projectie van u op v.</desc>
  <rect width="900" height="540" fill="#161410"/>
  <text x="450" y="40" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="26">Inwendig product</text>
  <defs>
    <marker id="mu" markerWidth="14" markerHeight="14" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 13,6.5 0,12" fill="#f3e2b0"/>
    </marker>
    <marker id="mv" markerWidth="14" markerHeight="14" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 13,6.5 0,12" fill="#7dcea0"/>
    </marker>
    <marker id="mp" markerWidth="14" markerHeight="14" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 13,6.5 0,12" fill="#e6c77a"/>
    </marker>
  </defs>
  <g transform="translate(130,400)">
    <!-- verlenging van de lijn van v, gestippeld, voorbij de voet -->
    <line x1="0" y1="0" x2="520" y2="-92" stroke="#6f6557" stroke-width="1.6" stroke-dasharray="7 7"/>
    <!-- v -->
    <line x1="0" y1="0" x2="460" y2="-81" stroke="#7dcea0" stroke-width="5" stroke-linecap="round" marker-end="url(#mv)"/>
    <!-- loodlijn van de punt van u naar de lijn van v -->
    <line x1="270" y1="-250" x2="336" y2="-59" stroke="#cbb98a" stroke-width="1.8" stroke-dasharray="6 7"/>
    <path d="M318 -84 L302 -81 L305 -64" fill="none" stroke="#cbb98a" stroke-width="2"/>
    <!-- projectievector, korter dan v, zelfde richting -->
    <line x1="0" y1="0" x2="322" y2="-57" stroke="#e6c77a" stroke-width="7" stroke-linecap="round" marker-end="url(#mp)"/>
    <!-- u -->
    <line x1="0" y1="0" x2="270" y2="-250" stroke="#f3e2b0" stroke-width="5" stroke-linecap="round" marker-end="url(#mu)"/>
    <path d="M86 -15 A88 88 0 0 0 72 -67" fill="none" stroke="#e6c77a" stroke-width="3"/>
    <text x="104" y="-50" fill="#e6c77a" font-family="Georgia, serif" font-size="22">θ</text>

    <circle cx="0" cy="0" r="5.5" fill="#f7edd6"/>
    <circle cx="336" cy="-59" r="4.5" fill="#e6c77a"/>

    <text x="286" y="-262" fill="#f3e2b0" font-family="Georgia, serif" font-size="22" font-weight="700">u</text>
    <text x="472" y="-78" fill="#7dcea0" font-family="Georgia, serif" font-size="22" font-weight="700">v</text>
    <text x="150" y="36" fill="#e6c77a" font-family="Georgia, serif" font-size="18">proj op v van u</text>
    <text x="348" y="-150" fill="#cbb98a" font-family="Georgia, serif" font-size="16">loodrecht</text>
    <text x="168" y="-8" fill="#fff6df" font-family="Georgia, serif" font-size="16">|u| cos θ</text>
  </g>
  <text x="450" y="478" text-anchor="middle" fill="#fff6df" font-family="Georgia, serif" font-size="22">u · v = |v| · (|u| cos θ)</text>
  <text x="450" y="508" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="16">De gouden pijl is de projectie. Het product is een getal, geen extra pijl.</text>
</svg>
