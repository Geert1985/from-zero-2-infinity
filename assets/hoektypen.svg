<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="th dh">
  <title id="th">Soorten hoeken</title>
  <desc id="dh">Scherp, recht, stomp en gestrekt.</desc>
  <rect width="900" height="340" fill="#161410"/>
  <text x="450" y="38" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="24">Soorten hoeken</text>
  <g font-family="Georgia, serif" text-anchor="middle">
    <g transform="translate(110,210)">
      <line x1="-70" y1="0" x2="80" y2="0" stroke="#e6c77a" stroke-width="3"/>
      <line x1="0" y1="0" x2="50" y2="-70" stroke="#e6c77a" stroke-width="3"/>
      <path d="M 28 0 A 28 28 0 0 0 20 -19.6" fill="none" stroke="#f3e2b0" stroke-width="2"/>
      <text x="5" y="48" fill="#cbb98a" font-size="16">scherp</text>
      <text x="5" y="70" fill="#8a7a58" font-size="13">&lt; 90°</text>
    </g>
    <g transform="translate(330,210)">
      <line x1="-70" y1="0" x2="80" y2="0" stroke="#e6c77a" stroke-width="3"/>
      <line x1="0" y1="0" x2="0" y2="-80" stroke="#e6c77a" stroke-width="3"/>
      <rect x="0" y="-18" width="18" height="18" fill="none" stroke="#f3e2b0" stroke-width="2"/>
      <text x="5" y="48" fill="#cbb98a" font-size="16">recht</text>
      <text x="5" y="70" fill="#8a7a58" font-size="13">90°</text>
    </g>
    <g transform="translate(550,210)">
      <line x1="-70" y1="0" x2="80" y2="0" stroke="#e6c77a" stroke-width="3"/>
      <line x1="0" y1="0" x2="-45" y2="-70" stroke="#e6c77a" stroke-width="3"/>
      <path d="M 32 0 A 32 32 0 0 0 -18.5 -26.1" fill="none" stroke="#f3e2b0" stroke-width="2"/>
      <text x="5" y="48" fill="#cbb98a" font-size="16">stomp</text>
      <text x="5" y="70" fill="#8a7a58" font-size="13">90°–180°</text>
    </g>
    <g transform="translate(770,210)">
      <line x1="-80" y1="0" x2="80" y2="0" stroke="#e6c77a" stroke-width="3"/>
      <path d="M 28 0 A 28 28 0 0 0 -28 0" fill="none" stroke="#f3e2b0" stroke-width="2"/>
      <text x="0" y="48" fill="#cbb98a" font-size="16">gestrekt</text>
      <text x="0" y="70" fill="#8a7a58" font-size="13">180°</text>
    </g>
  </g>
</svg>
