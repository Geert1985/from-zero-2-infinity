<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Vectoren optellen in drie stappen</title>
  <desc id="desc">Kop-staart op een raster: eerst (2,1), dan (3,4) aan die punt, dan de som (5,5).</desc>
  <rect width="900" height="560" fill="#161410"/>
  <text x="450" y="36" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="26">Vectoren optellen</text>
  <defs>
    <marker id="ma" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 12,6 0,11" fill="#f3e2b0"/>
    </marker>
    <marker id="mb" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 12,6 0,11" fill="#7dcea0"/>
    </marker>
    <marker id="ms" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0,1 12,6 0,11" fill="#e6c77a"/>
    </marker>
  </defs>

  <g transform="translate(78,430)">
    <text x="80" y="-230" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="16">1. Eerste verplaatsing</text>
    <g stroke="#3a3428" stroke-width="1">
      <line x1="40" y1="0" x2="40" y2="-160"/>
      <line x1="80" y1="0" x2="80" y2="-160"/>
      <line x1="120" y1="0" x2="120" y2="-160"/>
      <line x1="160" y1="0" x2="160" y2="-160"/>
      <line x1="0" y1="-40" x2="160" y2="-40"/>
      <line x1="0" y1="-80" x2="160" y2="-80"/>
      <line x1="0" y1="-120" x2="160" y2="-120"/>
      <line x1="0" y1="-160" x2="160" y2="-160"/>
    </g>
    <line x1="0" y1="0" x2="176" y2="0" stroke="#8a7a58" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-176" stroke="#8a7a58" stroke-width="2"/>
    <text x="184" y="5" fill="#e6c77a" font-family="Georgia, serif" font-size="16">x</text>
    <text x="8" y="-184" fill="#e6c77a" font-family="Georgia, serif" font-size="16">y</text>
    <line x1="0" y1="0" x2="80" y2="-40" stroke="#f3e2b0" stroke-width="5" stroke-linecap="round" marker-end="url(#ma)"/>
    <circle cx="0" cy="0" r="4.5" fill="#f7edd6"/>
    <text x="44" y="22" text-anchor="middle" fill="#f3e2b0" font-family="Georgia, serif" font-size="16">(2, 1)</text>
  </g>

  <g transform="translate(340,430)">
    <text x="100" y="-250" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="16">2. Tweede aan de punt</text>
    <g stroke="#3a3428" stroke-width="1">
      <line x1="40" y1="0" x2="40" y2="-200"/>
      <line x1="80" y1="0" x2="80" y2="-200"/>
      <line x1="120" y1="0" x2="120" y2="-200"/>
      <line x1="160" y1="0" x2="160" y2="-200"/>
      <line x1="200" y1="0" x2="200" y2="-200"/>
      <line x1="0" y1="-40" x2="200" y2="-40"/>
      <line x1="0" y1="-80" x2="200" y2="-80"/>
      <line x1="0" y1="-120" x2="200" y2="-120"/>
      <line x1="0" y1="-160" x2="200" y2="-160"/>
      <line x1="0" y1="-200" x2="200" y2="-200"/>
    </g>
    <line x1="0" y1="0" x2="216" y2="0" stroke="#8a7a58" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-216" stroke="#8a7a58" stroke-width="2"/>
    <text x="224" y="5" fill="#e6c77a" font-family="Georgia, serif" font-size="16">x</text>
    <text x="8" y="-224" fill="#e6c77a" font-family="Georgia, serif" font-size="16">y</text>
    <line x1="0" y1="0" x2="80" y2="-40" stroke="#f3e2b0" stroke-width="5" stroke-linecap="round" marker-end="url(#ma)"/>
    <line x1="80" y1="-40" x2="200" y2="-200" stroke="#7dcea0" stroke-width="5" stroke-linecap="round" marker-end="url(#mb)"/>
    <circle cx="0" cy="0" r="4.5" fill="#f7edd6"/>
    <circle cx="80" cy="-40" r="4" fill="#f7edd6"/>
    <text x="36" y="22" text-anchor="middle" fill="#f3e2b0" font-family="Georgia, serif" font-size="15">(2, 1)</text>
    <text x="214" y="-108" fill="#7dcea0" font-family="Georgia, serif" font-size="15">(3, 4)</text>
  </g>

  <g transform="translate(620,430)">
    <text x="100" y="-250" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="16">3. De som</text>
    <g stroke="#3a3428" stroke-width="1">
      <line x1="40" y1="0" x2="40" y2="-200"/>
      <line x1="80" y1="0" x2="80" y2="-200"/>
      <line x1="120" y1="0" x2="120" y2="-200"/>
      <line x1="160" y1="0" x2="160" y2="-200"/>
      <line x1="200" y1="0" x2="200" y2="-200"/>
      <line x1="0" y1="-40" x2="200" y2="-40"/>
      <line x1="0" y1="-80" x2="200" y2="-80"/>
      <line x1="0" y1="-120" x2="200" y2="-120"/>
      <line x1="0" y1="-160" x2="200" y2="-160"/>
      <line x1="0" y1="-200" x2="200" y2="-200"/>
    </g>
    <line x1="0" y1="0" x2="216" y2="0" stroke="#8a7a58" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="-216" stroke="#8a7a58" stroke-width="2"/>
    <text x="224" y="5" fill="#e6c77a" font-family="Georgia, serif" font-size="16">x</text>
    <text x="8" y="-224" fill="#e6c77a" font-family="Georgia, serif" font-size="16">y</text>
    <line x1="0" y1="0" x2="188" y2="-188" stroke="#e6c77a" stroke-width="4" stroke-linecap="round" marker-end="url(#ms)"/>
    <line x1="0" y1="0" x2="80" y2="-40" stroke="#f3e2b0" stroke-width="4" stroke-linecap="round" marker-end="url(#ma)"/>
    <line x1="80" y1="-40" x2="200" y2="-200" stroke="#7dcea0" stroke-width="4" stroke-linecap="round" marker-end="url(#mb)"/>
    <circle cx="0" cy="0" r="4.5" fill="#f7edd6"/>
    <circle cx="200" cy="-200" r="4.5" fill="#f7edd6"/>
    <text x="214" y="-168" fill="#e6c77a" font-family="Georgia, serif" font-size="16">(5, 5)</text>
  </g>

  <text x="450" y="508" text-anchor="middle" fill="#fff6df" font-family="Georgia, serif" font-size="20">(2, 1) + (3, 4) = (5, 5)</text>
  <text x="450" y="534" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="16">Eén hokje is één eenheid. De som loopt van de staart van de eerste naar de punt van de laatste.</text>
</svg>
