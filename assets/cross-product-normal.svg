<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Kruisproduct en loodrechte richting</title>
  <desc id="desc">Twee vectoren spannen een parallellogram op; het kruisproduct wijst loodrecht op het vlak.</desc>
  <rect width="900" height="470" rx="18" fill="#0d0b08"/>
  <text x="42" y="46" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#e6c77a">Kruisproduct: een loodrechte richting</text>
  <text x="42" y="76" font-family="system-ui, sans-serif" font-size="16" fill="#cbb98a">Twee vectoren bepalen een vlak; het kruisproduct levert een normaalvector.</text>
  <g stroke="#6f6557" stroke-width="2">
    <line x1="160" y1="365" x2="780" y2="365"/>
    <line x1="160" y1="365" x2="160" y2="120"/>
    <line x1="160" y1="365" x2="90" y2="415"/>
  </g>
  <polygon points="180,350 575,285 700,190 305,255" fill="#6ea8fe" fill-opacity="0.12" stroke="#6ea8fe" stroke-width="2"/>
  <line x1="180" y1="350" x2="575" y2="285" stroke="#6ea8fe" stroke-width="9"/>
  <polygon points="575,285 545,279 551,306" fill="#6ea8fe"/>
  <line x1="180" y1="350" x2="305" y2="255" stroke="#e07a6a" stroke-width="9"/>
  <polygon points="305,255 277,259 293,280" fill="#e07a6a"/>
  <line x1="305" y1="255" x2="700" y2="190" stroke="#6ea8fe" stroke-width="5" stroke-dasharray="8 6"/>
  <line x1="575" y1="285" x2="700" y2="190" stroke="#e07a6a" stroke-width="5" stroke-dasharray="8 6"/>
  <line x1="305" y1="255" x2="480" y2="125" stroke="#7dcea0" stroke-width="10"/>
  <polygon points="480,125 452,136 469,158" fill="#7dcea0"/>
  <text x="520" y="112" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#7dcea0">u × v</text>
  <text x="585" y="278" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#6ea8fe">u</text>
  <text x="292" y="247" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#e07a6a">v</text>
  <rect x="535" y="350" width="310" height="70" rx="12" fill="#16130e" stroke="#e6c77a"/>
  <text x="690" y="381" text-anchor="middle" font-family="serif" font-size="22" fill="#fff6df">|u × v| = |u| |v| sin(θ)</text>
  <text x="690" y="404" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#cbb98a">grootte = oppervlakte van het parallellogram</text>
</svg>