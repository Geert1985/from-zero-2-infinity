<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="tu du">
  <title id="tu">Eenheidscirkel: cosinus en sinus</title>
  <desc id="du">Straal onder hoek theta. Cosinus en sinus bij de voetpunten. 1 en -1 buiten de cirkelrand.</desc>
  <rect width="900" height="460" fill="#161410"/>
  <text x="450" y="28" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="22">Eenheidscirkel — straal 1</text>
  <g font-family="Georgia, serif">
    <line x1="120" y1="248" x2="700" y2="248" stroke="#e6c77a" stroke-width="1.6"/>
    <line x1="340" y1="400" x2="340" y2="70" stroke="#e6c77a" stroke-width="1.6"/>
    <polygon points="700,242 716,248 700,254" fill="#e6c77a"/>
    <polygon points="334,70 340,54 346,70" fill="#e6c77a"/>
    <text x="708" y="236" fill="#e6c77a" font-size="15">x</text>
    <text x="350" y="66" fill="#e6c77a" font-size="15">y</text>
    <circle cx="340" cy="248" r="132" fill="none" stroke="#cbb98a" stroke-width="1.7"/>
    <path d="M 376 248 A 36 36 0 0 0 368.4 225.8" fill="none" stroke="#c4a45a" stroke-width="2"/>
    <text x="382" y="236" fill="#c4a45a" font-size="16">θ</text>
    <line x1="340" y1="248" x2="444" y2="166.7" stroke="#f3e2b0" stroke-width="2"/>
    <line x1="444" y1="166.7" x2="444" y2="248" stroke="#c4a45a" stroke-width="1.5" stroke-dasharray="5 4"/>
    <line x1="444" y1="166.7" x2="340" y2="166.7" stroke="#8a7a58" stroke-width="1.5" stroke-dasharray="5 4"/>
    <circle cx="444" cy="248" r="3.5" fill="#c4a45a"/>
    <circle cx="340" cy="166.7" r="3.5" fill="#8a7a58"/>
    <circle cx="444" cy="166.7" r="5.5" fill="#f3e2b0"/>
    <text x="456" y="158" fill="#f3e2b0" font-size="15">(cos θ, sin θ)</text>
    <text x="430" y="268" fill="#c4a45a" font-size="14">cos θ</text>
    <text x="332" y="162" text-anchor="end" fill="#8a7a58" font-size="14">sin θ</text>
    <text x="488" y="244" fill="#e6c77a" font-size="15">1</text>
    <text x="178" y="244" fill="#e6c77a" font-size="15">−1</text>
    <text x="352" y="108" fill="#e6c77a" font-size="15">1</text>
    <text x="352" y="400" fill="#e6c77a" font-size="15">−1</text>
  </g>
  <text x="450" y="436" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="15">Stippellijn naar de x-as: cos θ. Stippellijn naar de y-as: sin θ.</text>
</svg>
