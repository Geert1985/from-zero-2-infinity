<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Vector met componenten</title>
  <desc id="desc">Een vector naar het punt met componenten 4 en 3, met horizontale en verticale componenten zichtbaar.</desc>
  <rect width="900" height="430" rx="18" fill="#0d0b08"/>
  <g font-family="system-ui, sans-serif" fill="#f7edd6">
    <text x="42" y="46" font-size="24" font-weight="700" fill="#e6c77a">Een vector als componenten</text>
    <text x="42" y="76" font-size="16" fill="#cbb98a">De pijl bevat één richting, opgebouwd uit twee loodrechte bijdragen.</text>
  </g>
  <g stroke="#6f6557" stroke-width="2">
    <line x1="130" y1="350" x2="790" y2="350"/>
    <line x1="130" y1="350" x2="130" y2="105"/>
  </g>
  <g fill="#cbb98a" font-family="system-ui, sans-serif" font-size="16">
    <text x="798" y="356">x</text><text x="116" y="96">y</text>
  </g>
  <g stroke="#6f6557" stroke-width="2" stroke-dasharray="7 7">
    <line x1="650" y1="140" x2="650" y2="350"/>
    <line x1="130" y1="140" x2="650" y2="140"/>
  </g>
  <line x1="130" y1="350" x2="650" y2="350" stroke="#e6c77a" stroke-width="7"/>
  <line x1="650" y1="350" x2="650" y2="140" stroke="#7dcea0" stroke-width="7"/>
  <line x1="130" y1="350" x2="650" y2="140" stroke="#6ea8fe" stroke-width="9"/>
  <polygon points="650,140 620,157 638,178" fill="#6ea8fe"/>
  <g font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    <text x="375" y="382" fill="#e6c77a">vₓ = 4</text>
    <text x="665" y="250" fill="#7dcea0">vᵧ = 3</text>
    <text x="515" y="225" fill="#6ea8fe">v = (4, 3)</text>
  </g>
  <circle cx="130" cy="350" r="7" fill="#f7edd6"/>
  <circle cx="650" cy="140" r="7" fill="#f7edd6"/>
</svg>