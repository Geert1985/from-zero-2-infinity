<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="tv dv">
  <title id="tv">Verticale-lijntest</title>
  <desc id="dv">Links een rechte: verticale lijn snijdt één keer, het is een functie. Rechts een cirkel: twee snijpunten, geen functie van x.</desc>
  <rect width="900" height="420" fill="#161410"/>
  <text x="450" y="34" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="24">Verticale-lijntest</text>

  <g transform="translate(80,70)" font-family="Georgia, serif">
    <text x="160" y="18" text-anchor="middle" fill="#cbb98a" font-size="16">wel een functie</text>
    <line x1="30" y1="280" x2="300" y2="280" stroke="#e6c77a" stroke-width="2"/>
    <line x1="40" y1="290" x2="40" y2="40" stroke="#e6c77a" stroke-width="2"/>
    <polygon points="300,273 316,280 300,287" fill="#e6c77a"/>
    <polygon points="33,40 40,24 47,40" fill="#e6c77a"/>
    <line x1="70" y1="250" x2="270" y2="90" stroke="#f3e2b0" stroke-width="3"/>
    <line x1="160" y1="40" x2="160" y2="290" stroke="#c4a45a" stroke-width="2" stroke-dasharray="7 5"/>
    <circle cx="160" cy="178" r="6" fill="#c4a45a"/>
    <text x="172" y="172" fill="#c4a45a" font-size="14">1 punt</text>
  </g>

  <g transform="translate(500,70)" font-family="Georgia, serif">
    <text x="170" y="18" text-anchor="middle" fill="#cbb98a" font-size="16">geen functie van x</text>
    <line x1="30" y1="280" x2="300" y2="280" stroke="#e6c77a" stroke-width="2"/>
    <line x1="40" y1="290" x2="40" y2="40" stroke="#e6c77a" stroke-width="2"/>
    <polygon points="300,273 316,280 300,287" fill="#e6c77a"/>
    <polygon points="33,40 40,24 47,40" fill="#e6c77a"/>
    <circle cx="170" cy="170" r="88" fill="none" stroke="#f3e2b0" stroke-width="3"/>
    <line x1="170" y1="40" x2="170" y2="290" stroke="#c4a45a" stroke-width="2" stroke-dasharray="7 5"/>
    <circle cx="170" cy="82" r="6" fill="#c4a45a"/>
    <circle cx="170" cy="258" r="6" fill="#c4a45a"/>
    <text x="182" y="78" fill="#c4a45a" font-size="14">2 punten</text>
  </g>

  <text x="450" y="396" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="16">Een verticale lijn mag de grafiek hoogstens één keer snijden.</text>
</svg>
