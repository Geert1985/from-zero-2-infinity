    <text x="-78" y="-48" fill="#f3e2b0" font-family="Georgia, serif" font-size="16">(0, 1)</text>
    <text x="132" y="-292" fill="#f3e2b0" font-family="Georgia, serif" font-size="16">(3, 7)</text>
    <path d="M 0 -40 H 40 V -120" fill="none" stroke="#c4a45a" stroke-width="2"/>
    <text x="48" y="-52" fill="#d7c49a" font-family="Georgia, serif" font-size="14">+1</text>
    <text x="48" y="-96" fill="#d7c49a" font-family="Georgia, serif" font-size="14">+2</text>
  </g>
  <text x="450" y="518" text-anchor="middle" fill="#cbb98a" font-family="Georgia, serif" font-size="17">De lijn gaat door (0, 1) en (3, 7). Helling 2: +1 in x geeft +2 in y.</text>
