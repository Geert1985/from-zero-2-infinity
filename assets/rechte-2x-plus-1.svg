<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t3 d3">
  <title id="t3">De rechte y = 2x + 1</title>
  <desc id="d3">Lijn met helling 2 door de punten (0, 1) en (3, 7).</desc>
  <rect width="900" height="540" fill="#161410"/>
  <text x="450" y="36" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="26">y = 2x + 1</text>
  <g transform="translate(280,450)">
    <g stroke="#3a3428" stroke-width="1">
      <line x1="-80" y1="40" x2="280" y2="40"/>
      <line x1="-80" y1="0" x2="280" y2="0"/>
      <line x1="-80" y1="-40" x2="280" y2="-40"/>
      <line x1="-80" y1="-80" x2="280" y2="-80"/>
      <line x1="-80" y1="-120" x2="280" y2="-120"/>
      <line x1="-80" y1="-160" x2="280" y2="-160"/>
      <line x1="-80" y1="-200" x2="280" y2="-200"/>
      <line x1="-80" y1="-240" x2="280" y2="-240"/>
      <line x1="-80" y1="-280" x2="280" y2="-280"/>
      <line x1="-80" y1="-320" x2="280" y2="-320"/>
      <line x1="-80" y1="-360" x2="280" y2="-360"/>
      <line x1="-40" y1="50" x2="-40" y2="-370"/>
