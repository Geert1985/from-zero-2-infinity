    <line x1="-80" y1="0" x2="270" y2="0" stroke="#e6c77a" stroke-width="2.5"/>
    <line x1="0" y1="50" x2="0" y2="-370" stroke="#e6c77a" stroke-width="2.5"/>
    <polygon points="270,-7 290,0 270,7" fill="#e6c77a"/>
    <polygon points="-7,-370 0,-390 7,-370" fill="#e6c77a"/>
    <text x="278" y="-16" fill="#e6c77a" font-family="Georgia, serif" font-size="18">x</text>
    <text x="12" y="-378" fill="#e6c77a" font-family="Georgia, serif" font-size="18">y</text>
    <line x1="-60" y1="80" x2="160" y2="-360" stroke="#f3e2b0" stroke-width="3"/>
