<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t3 d3">
  <title id="t3">De rechte y = 2x + 1</title>
  <desc id="d3">Lijn door (0, 1) en (3, 7). Helling m = (7 − 1)/(3 − 0) = 2.</desc>
  <rect width="900" height="500" fill="#161410"/>
  <text x="450" y="34" text-anchor="middle" fill="#e6c77a" font-family="Georgia, serif" font-size="24">y = 2x + 1</text>
  <g transform="translate(240,430)" font-family="Georgia, serif">
    <g stroke="#3a3428" stroke-width="1">
      <line x1="-60" y1="40" x2="260" y2="40"/>
      <line x1="-60" y1="0" x2="260" y2="0"/>
      <line x1="-60" y1="-40" x2="260" y2="-40"/>
      <line x1="-60" y1="-80" x2="260" y2="-80"/>
      <line x1="-60" y1="-120" x2="260" y2="-120"/>
      <line x1="-60" y1="-160" x2="260" y2="-160"/>
      <line x1="-60" y1="-200" x2="260" y2="-200"/>
      <line x1="-60" y1="-240" x2="260" y2="-240"/>
      <line x1="-60" y1="-280" x2="260" y2="-280"/>
      <line x1="-60" y1="-320" x2="260" y2="-320"/>
      <line x1="-60" y1="-360" x2="260" y2="-360"/>
      <line x1="-40" y1="50" x2="-40" y2="-370"/>
      <line x1="0" y1="50" x2="0" y2="-370"/>
      <line x1="40" y1="50" x2="40" y2="-370"/>
      <line x1="80" y1="50" x2="80" y2="-370"/>
      <line x1="120" y1="50" x2="120" y2="-370"/>
      <line x1="160" y1="50" x2="160" y2="-370"/>
      <line x1="200" y1="50" x2="200" y2="-370"/>
    </g>
    <line x1="-60" y1="0" x2="250" y2="0" stroke="#e6c77a" stroke-width="2.2"/>
    <line x1="0" y1="50" x2="0" y2="-370" stroke="#e6c77a" stroke-width="2.2"/>
    <polygon points="250,-6 266,0 250,6" fill="#e6c77a"/>
    <polygon points="-6,-370 0,-386 6,-370" fill="#e6c77a"/>
    <text x="256" y="-14" fill="#e6c77a" font-size="16">x</text>
    <text x="10" y="-374" fill="#e6c77a" font-size="16">y</text>
    <line x1="-50" y1="60" x2="160" y2="-360" stroke="#f3e2b0" stroke-width="2.6"/>
    <circle cx="0" cy="-40" r="6" fill="#f3e2b0"/>
    <circle cx="120" cy="-280" r="6" fill="#f3e2b0"/>
    <text x="-86" y="-46" fill="#f3e2b0" font-size="15">(0, 1)</text>
    <text x="130" y="-288" fill="#f3e2b0" font-size="15">(3, 7)</text>
    <path d="M 0 -40 H 40 V -120" fill="none" stroke="#c4a45a" stroke-width="2"/>
    <text x="20" y="-22" text-anchor="middle" fill="#c4a45a" font-size="15">+1</text>
    <text x="52" y="-76" fill="#c4a45a" font-size="15">+2</text>
  </g>
  <g font-family="Georgia, serif" fill="#e6c77a">
    <text x="620" y="210" font-size="18">m = Δy / Δx</text>
    <text x="620" y="242" font-size="18">m = (7 − 1) / (3 − 0)</text>
    <text x="620" y="274" font-size="18">m = 6 / 3 = 2</text>
  </g>
</svg>
