name: Add Fase 1.6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add milestone 1.6 to fase1.js
        env:
          MILESTONE_B64: "  b3IgYmVpZGUgdGVybXMgdG9wIGRlIGRlbGVuIGRv      b3JiZWVsZDogMSBjbSBvcCBkZSBwbGFuIGNvbW10IG92ZXJlZW4gbWV0OjwvcD4KPHA+Y2xhc3M9ImZvcm11bGEiPjEg4oKsIDEwMCA9IDEwMCBjbTwvcD4KPHA+RGF0IGlzIDEgbWV0ZXIuPC9wPgo8cD5FZW4gbXV1ciBkaWUgb3AgZWVuIHBsYW4gNCBjbSBsYW5nIGlzLCBpcyBpbjwv  "
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64, os
          path = Path("fase1.js")
          text = path.read_text(encoding="utf-8")
          if 'id: "1.6"' not in text:
              milestone = base64.b64decode(os.environ["MILESTONE_B64"]).decode("utf-8")
              marker = "\n];\n"
              if marker not in text:
                  raise SystemExit("Closing marker of fase1.js not found")
              text = text.replace(marker, "\n,\n" + milestone + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY2

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/add-fase1-1.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fase1.js .github/workflows/add-fase1-1.6.yml
          git diff --cached --quiet && exit 0
          git commit -m "Werk fase 1.6 uit: verhoudingen en evenredigheid"
          git push
