name: Fix Fase 1.6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install correct Fase 1.6
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("fase1.js")
          milestone_path = Path("fase1-1.6.tmp")
          text = path.read_text(encoding="utf-8")
          milestone = milestone_path.read_text(encoding="utf-8").rstrip() + "\n"

          marker = "\n];\n"
          if marker not in text:
              raise SystemExit("Closing marker of fase1.js not found")

          start_marker = '  {\n    id: "1.6"'
          start = text.find(start_marker)
          close = text.find(marker)

          if start != -1 and start < close:
              text = text[:start] + milestone + text[close:]
          else:
              text = text.replace(marker, "\n,\n" + milestone + marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary files and commit
        run: |
          rm -f fase1-1.6.tmp .github/workflows/add-fase1-1.6.yml .github/workflows/fix-fase1-1.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fase1.js fase1-1.6.tmp .github/workflows/add-fase1-1.6.yml .github/workflows/fix-fase1-1.6.yml
          git commit -m "Werk fase 1.6 uit: verhoudingen en evenredigheid"
          git push
