name: Publish Fase 1.10 and 1.11

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert milestones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('fase1.js')
          text = path.read_text(encoding='utf-8')
          if 'id: "1.10"' in text or 'id: "1.11"' in text:
              raise SystemExit('Fase 1.10 or 1.11 is already present; refusing to duplicate.')
          marker = '\n];\n'
          if marker not in text:
              raise SystemExit('Could not find end of MILESTONES_1 array.')
          part10 = Path('fase1-1.10.tmp').read_text(encoding='utf-8')
          part11 = Path('fase1-1.11.tmp').read_text(encoding='utf-8')
          replacement = ',\n' + part10 + '\n' + part11 + marker
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check fase1.js

      - name: Remove temporary files
        run: rm -f fase1-1.10.tmp fase1-1.11.tmp .github/workflows/add-fase1-1.10-1.11.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fase1.js fase1-1.10.tmp fase1-1.11.tmp .github/workflows/add-fase1-1.10-1.11.yml
          git commit -m "Werk fase 1.10 en 1.11 uit: machten en wortels"
          git push
