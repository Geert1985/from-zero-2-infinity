name: Publish phase 1.13 final
on: push
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: python3 publish-fase1-13.py
      - name: Validate JavaScript
        run: node --check fase1.js && node --check math.js
      - name: Commit and push
        run: |
          rm -f fase1-1.13.tmp publish-fase1-13.py
          rm -f .github/workflows/publish-fase1-13.yml .github/workflows/publish-fase1-13-simple.yml .github/workflows/publish-fase1-13-final.yml .github/workflows/test-branch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fase1.js math.js Projectcontext_AI.md
          git add -u .github/workflows fase1-1.13.tmp publish-fase1-13.py
          git commit -m "Werk fase 1.13 uit en verbeter inline LaTeX"
          git push origin HEAD:chatGPT/fase1
