name: Add Fase 1.7

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Fase 1.7
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fase1.js')
          part = Path('fase1-1.7.tmp').read_text(encoding='utf-8').rstrip() + '\n'
          text = path.read_text(encoding='utf-8')
          marker = '\n];\n'
          if 'id: "1.7"' in text:
              raise SystemExit('Fase 1.7 already exists')
          if marker not in text:
              raise SystemExit('Closing marker not found')
          text = text.replace(marker, '\n' + part + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit and clean up
        run: |
          rm -f fase1-1.7.tmp .github/workflows/add-fase1-1.7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fase1.js fase1-1.7.tmp .github/workflows/add-fase1-1.7.yml
          git commit -m 'Werk fase 1.7 uit: delers en deelbaarheid'
          git push
