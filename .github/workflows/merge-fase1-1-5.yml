name: Integrate Fase 1.5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Integrate 1.5 and remove extension
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          fase = Path("fase1.js")
          snippet = Path("fase1-1.5-snippet.tmp").read_text(encoding="utf-8")
          text = fase.read_text(encoding="utf-8")
          marker = '  {\n    id: "1.5"'
          start = text.find(marker)
          if start == -1:
              raise SystemExit("Milestone 1.5 not found")
          fase.write_text(text[:start] + snippet + "\n];\n", encoding="utf-8")
          ext = Path("fase1-uitbreiding.js")
          if ext.exists():
              ext.unlink()
          Path("fase1-1.5-snippet.tmp").unlink()
          PY

      - name: Commit final files and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/merge-fase1-1-5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fase1.js fase1-uitbreiding.js fase1-1.5-snippet.tmp .github/workflows/merge-fase1-1-5.yml
          git commit -m "Werk lesstof 1.5 uit" || exit 0
          git push
