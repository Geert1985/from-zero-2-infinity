name: Restructure Phase 1

on:
  push:
    branches:
      - GROK---F0
    paths:
      - '.github/workflows/restructure-fase1.yml'

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restructure fase1.js
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'fase1.js';
          let src = fs.readFileSync(path, 'utf8');

          const goals = {
            '1.1': 'Hoe kunnen we met een klein aantal cijfers oneindig veel getallen schrijven, en hoe lezen we hun plaatswaarde?',
            '1.2': 'Hoe helpen plaatswaarde en de getallenlijn ons om natuurlijke getallen te ordenen en te vergelijken?',
            '1.3': 'Waarom hebben optellen en aftrekken verschillende eigenschappen, en hoe hangen beide bewerkingen samen?',
            '1.4': 'Hoe hangen vermenigvuldigen, delen en delen met rest samen, en waarom is delen door nul onmogelijk?',
            '1.5': 'Waarom moeten we de natuurlijke getallen uitbreiden, en hoe helpen tegengestelde getallen en absolute waarde ons rekenen?',
            '1.6': 'Hoe beschrijft een breuk een geheel dat in gelijke delen is verdeeld, en waarom is een breuk ook een getal?',
            '1.7': 'Waarom werken de rekenregels voor breuken zoals ze doen, en hoe kunnen we ermee rekenen zonder hun betekenis te verliezen?',
            '1.8': 'Hoe kunnen we hetzelfde getal schrijven als gemengd getal, decimaal en percentage, en wat zegt dat over procentuele verandering?',
            '1.9': 'Wat maakt een getal rationaal, en hoe zien we rationale getallen op de getallenlijn?',
            '1.10': 'Wanneer blijven twee grootheden in dezelfde verhouding, en hoe herkennen we directe evenredigheid?',
            '1.11': 'Hoe kunnen we met delers, veelvouden en deelbaarheidsregels de structuur van gehele getallen snel herkennen?',
            '1.12': 'Waarom zijn priemgetallen de bouwstenen van natuurlijke getallen, en waarom is de priemfactorisatie uniek?',
            '1.13': 'Hoe kunnen we gemeenschappelijke delers en veelvouden systematisch vinden, en waarom werkt het algoritme van Euclides?',
            '1.14': 'Hoe kunnen we herhaalde vermenigvuldiging compact schrijven, en waarom werken de machtswetten?',
            '1.15': 'Hoe draait worteltrekken het kwadrateren om, en hoe kunnen we wortels schatten en vereenvoudigen?',
            '1.16': 'Waarom kan wortel 2 niet als breuk worden geschreven, en hoe herkennen we irrationale getallen?',
            '1.17': 'Hoe hangen natuurlijke, gehele, rationale en reële getallen samen, en waarom is de getallenlijn dicht?',
            '1.18': 'Hoe kan hetzelfde getal verschillende schrijfwijzen hebben, en hoe werkt plaatswaarde in andere talstelsels?',
            '1.19': 'Hoe kunnen we resten als wiskundig object beschrijven, en hoe helpt modulo ons om patronen te herkennen?',
            '1.20': 'Hoe kiezen we een passende nauwkeurigheid, schatten we uitkomsten en schrijven we grote en kleine getallen compact?'
          };

          const procedures = {
            '1.1': ['Bepaal eerst welke cijfers in het getal staan.', 'Lees de plaats van elk cijfer van rechts naar links.', 'Bepaal de plaatswaarde met de overeenkomstige macht van 10.', 'Gebruik de getallenlijn of plaatswaarden om getallen te vergelijken.'],
            '1.2': ['Vergelijk eerst het aantal cijfers.', 'Zijn de aantallen gelijk, vergelijk dan van links naar rechts.', 'Gebruik bij het eerste verschil de plaatswaarde om de ordening te bepalen.', 'Controleer de uitkomst eventueel op de getallenlijn.'],
            '1.3': ['Vertaal de situatie naar een optelling of aftrekking.', 'Voer de bewerking uit.', 'Controleer een aftrekking met de omgekeerde optelling.', 'Let erop dat omwisselen bij aftrekken het antwoord verandert.'],
            '1.4': ['Bepaal of je moet groeperen, vermenigvuldigen of verdelen.', 'Bij een deling met rest bepaal je eerst het grootste volledige quotiënt.', 'Schrijf de rest kleiner dan de deler.', 'Controleer met deler × quotiënt + rest = deeltal.', 'Deel nooit door nul.'],
            '1.5': ['Plaats de getallen op de getallenlijn.', 'Gebruik het tegenovergestelde om aftrekken als optellen te schrijven.', 'Gebruik absolute waarde als afstand tot nul.', 'Bepaal bij vermenigvuldigen en delen eerst het teken en daarna de absolute waarden.'],
            '1.6': ['Bepaal eerst in hoeveel gelijke delen het geheel wordt verdeeld.', 'Bepaal daarna hoeveel delen worden genomen.', 'Plaats de breuk eventueel op de getallenlijn.', 'Controleer of teller en noemer de bedoelde rollen hebben.'],
            '1.7': ['Vereenvoudig eerst wanneer dat mogelijk is.', 'Maak bij optellen en aftrekken de noemers gelijk.', 'Vermenigvuldig bij breuken teller met teller en noemer met noemer.', 'Vervang delen door een breuk door vermenigvuldigen met het omgekeerde.', 'Vereenvoudig het eindresultaat.'],
            '1.8': ['Kies de schrijfwijze die de situatie het duidelijkst maakt.', 'Zet een breuk om via een passende noemer of deling.', 'Gebruik per honderd om een percentage te interpreteren.', 'Bij procentuele verandering vergelijk je met de oorspronkelijke waarde.'],
            '1.9': ['Schrijf het getal als a/b met gehele a en b ≠ 0.', 'Vereenvoudig de breuk indien nodig.', 'Gebruik de getallenlijn om de positie te interpreteren.', 'Controleer of verschillende breuken dezelfde waarde voorstellen.'],
            '1.10': ['Bepaal welke twee grootheden worden vergeleken.', 'Controleer of dezelfde vermenigvuldigingsfactor op beide grootheden werkt.', 'Bepaal bij y = kx de constante k.', 'Controleer bij praktische problemen de eenheden en schaal.'],
            '1.11': ['Zoek eerst naar eenvoudige delers of veelvouden.', 'Gebruik de passende deelbaarheidsregel.', 'Combineer regels wanneer een getal door een samengesteld getal moet delen.', 'Controleer een gevonden deler eventueel met een vermenigvuldiging.'],
            '1.12': ['Controleer of het getal groter is dan 1.', 'Zoek een geschikte deler.', 'Ontbind verder totdat alle factoren priem zijn.', 'Schrijf de priemfactoren systematisch en controleer door terug te vermenigvuldigen.'],
            '1.13': ['Kies voor kleine getallen delers of veelvouden.', 'Gebruik priemfactorisatie wanneer dat overzichtelijker is.', 'Bij de GGD neem je de gemeenschappelijke factoren.', 'Bij het KGV neem je alle benodigde factoren.', 'Bij Euclides herhaal je delen met rest totdat de rest nul is.'],
            '1.14': ['Identificeer grondtal en exponent.', 'Schrijf de macht desnoods als herhaalde vermenigvuldiging.', 'Gebruik bij hetzelfde grondtal de passende machtsregel.', 'Controleer bij exponent nul dat het grondtal niet nul is.'],
            '1.15': ['Zoek eerst twee naburige kwadraten.', 'Plaats de wortel tussen de bijbehorende gehele getallen.', 'Controleer een benadering door te kwadrateren.', 'Zoek bij vereenvoudigen een volmaakt kwadraat als factor.'],
            '1.16': ['Schrijf het getal als breuk als je wilt testen of het rationaal is.', 'Onderzoek bij een wortel of een rationele representatie mogelijk is.', 'Let bij decimalen op eindigheid of herhaling.', 'Verwar oneindig veel decimalen niet met irrationaliteit.'],
            '1.17': ['Bepaal eerst tot welke getallenverzameling een getal behoort.', 'Gebruik de inclusieketen om verzamelingen te vergelijken.', 'Gebruik gemiddelden om een getal tussen twee reële getallen te vinden.', 'Plaats de waarden op de getallenlijn.'],
            '1.18': ['Bepaal de basis van het talstelsel.', 'Koppel ieder cijfer aan zijn macht van de basis.', 'Tel de plaatswaarden op.', 'Controleer de representatie door terug te converteren.'],
            '1.19': ['Bepaal de rest bij deling.', 'Schrijf de congruentie modulo n.', 'Gebruik optellen en vermenigvuldigen binnen dezelfde modulus.', 'Controleer periodieke patronen via een passende modulus.'],
            '1.20': ['Bepaal eerst welke nauwkeurigheid nodig is.', 'Kijk naar het eerste cijfer dat je weglaat.', 'Gebruik afronding voor een snelle schatting.', 'Schrijf grote of kleine waarden in genormaliseerde wetenschappelijke notatie.', 'Controleer of de orde van grootte klopt.']
          };

          function escapeReplacement(s) {
            return s.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
          }

          // Goals: convert each milestone to one central investigation question.
          for (const [id, goal] of Object.entries(goals)) {
            const re = new RegExp('(id:\\s*["\\\']' + id.replace('.', '\\.') + '["\\\'][\\s\\S]*?goal:\\s*)["\\\'][^"\\\']*["\\\']');
            src = src.replace(re, (_, prefix) => prefix + '"' + escapeReplacement(goal) + '"');
          }

          // Process each theory template independently.
          const theoryRe = /(id:\s*["'](1\.\d+)["'][\s\S]*?theory:\s*\/\* html \*\/`)([\s\S]*?)(`\s*\},?)/g;
          src = src.replace(theoryRe, (whole, prefix, id, theory, suffix) => {
            let t = theory;

            // Remove legacy self-study blocks if any remain.
            t = t.replace(/<h[34][^>]*>[^<]*(?:Zelfstandig|Zelf proberen)[^<]*<\/h[34]>[\s\S]*?(?=<h[34][^>]*>|$)/gi, '');

            // Normalize lone LaTeX backslashes in lesson templates while preserving already escaped pairs.
            t = t.replace(/(?<!\\)\\(?!\\)/g, '\\\\');

            // Keep mathematical notation in LaTeX form inside formula blocks.
            t = t.replace(/(<(?:p|span)[^>]*class="formula(?:-inline)?"[^>]*>[\s\S]*?<\/\/(?:p|span)>)/g, block =>
              block.replace(/×/g, '\\\\times').replace(/÷/g, '\\\\div').replace(/−/g, '-'));

            // Turn insight counterexamples into one explicit common-mistakes section.
            const mistakes = [];
            t = t.replace(/<div class="callout insight">\s*<strong>Tegenvoorbeeld<\/strong>\s*<p>([\s\S]*?)<\/p>\s*<\/div>/gi, (_, text) => {
              mistakes.push(text.trim());
              return '';
            });
            if (mistakes.length) {
              t += '\n<h3>Veelgemaakte fouten</h3>\n<ul>\n' + mistakes.map(x => `  <li>${x}</li>`).join('\n') + '\n</ul>\n';
            }

            if (procedures[id]) {
              t += '\n<h3>Vaste werkwijze</h3>\n<div class="callout">\n  <p><strong>Vaste werkwijze</strong></p>\n  <ol>\n' + procedures[id].map(x => `    <li>${x}</li>`).join('\n') + '\n  </ol>\n</div>\n';
            }

            const next = Number(id.split('.')[1]) + 1;
            const bridge = next <= 20
              ? `In deze les hebben we ${id} opgebouwd rond één centrale vraag. De volgende stap is <strong>1.${next}</strong>, waar we voortbouwen op deze kennis.`
              : 'Met deze les ronden we Fase 1 af. De opgebouwde getallenkennis vormt de basis voor Fase 2: algebra en geometrie.';
            const core = {
              '1.1':'Getallen worden met cijfers geschreven; plaatswaarde maakt duidelijk welke waarde ieder cijfer in een getal heeft.',
              '1.2':'Plaatswaarde en de getallenlijn geven een systematische manier om natuurlijke getallen te ordenen.',
              '1.3':'Optellen en aftrekken zijn inverse bewerkingen, maar hebben niet dezelfde rekenwetten.',
              '1.4':'Vermenigvuldigen en delen zijn inverse bewerkingen; bij een gehele deling beschrijft de rest wat overblijft.',
              '1.5':'De gehele getallen breiden de natuurlijke getallen uit zodat aftrekkingen zoals 3 − 5 een plaats krijgen.',
              '1.6':'Een breuk beschrijft een aantal gelijke delen en stelt tegelijk een getal met een vaste plaats op de getallenlijn voor.',
              '1.7':'De rekenregels voor breuken volgen uit de betekenis van teller, noemer en gelijkwaardige breuken.',
              '1.8':'Breuk, decimaal en percentage zijn verschillende schrijfwijzen van dezelfde waarde.',
              '1.9':'Een rationaal getal is een quotiënt van twee gehele getallen met een niet-nul noemer.',
              '1.10':'Bij directe evenredigheid verandert de ene grootheid met dezelfde factor als de andere.',
              '1.11':'Delers en veelvouden maken deelbaarheid zichtbaar en deelbaarheidsregels versnellen het onderzoek.',
              '1.12':'Priemgetallen zijn de bouwstenen van natuurlijke getallen groter dan 1 en hun factorisatie is uniek.',
              '1.13':'GGD en KGV beantwoorden verschillende gemeenschappelijke-vragen; Euclides maakt de GGD systematisch berekenbaar.',
              '1.14':'Machten comprimeren herhaalde vermenigvuldiging en hun rekenregels volgen uit het tellen van factoren.',
              '1.15':'De vierkantswortel is de niet-negatieve omgekeerde bewerking van kwadrateren.',
              '1.16':'Irrationale getallen kunnen niet als breuk van gehele getallen worden geschreven; wortel 2 is een fundamenteel voorbeeld.',
              '1.17':'De reële getallen omvatten rationale en irrationale getallen en vormen een dichte getallenlijn.',
              '1.18':'Een getal is onafhankelijk van zijn representatie; in een positiestelsel bepaalt de basis de plaatswaarden.',
              '1.19':'Modulo beschrijft resten en maakt periodieke patronen en deelbaarheid formeel hanteerbaar.',
              '1.20':'Afronden en wetenschappelijke notatie maken nauwkeurigheid en orde van grootte expliciet.'
            }[id];

            t += `\n<h3>Samenvatting en verbinding</h3>\n<p>${core}</p>\n<div class="callout">\n  <p><strong>Kernidee</strong></p>\n  <p>${bridge}</p>\n</div>\n`;

            return prefix + t + suffix;
          });

          fs.writeFileSync(path, src);
          NODE

      - name: Validate JavaScript
        run: node --check fase1.js

      - name: Commit only fase1.js
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fase1.js
          git reset -- .github/workflows/restructure-fase1.yml
          git commit -m "Restructure Phase 1 lessons" || exit 0
          git push

      - name: Remove temporary workflow
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/restructure-fase1.yml || true
          git commit -m "Remove temporary Phase 1 restructuring workflow" || true
          git push || true
